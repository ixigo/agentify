version = "1.0"

[metadata]
category = "decision-recall"
tags = ["agentify", "context", "decision-recall", "webhook-security"]
difficulty = "hard"
description = "Verify a webhook whose signature prefix and canonical payload separator exist only in a recorded security decision. Store-size ladder small rung: the same knowledge among a handful of deterministic decoy notes (store size 10), run under the ladder's uniform \$0.70 cap so budget never confounds the size axis."

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
