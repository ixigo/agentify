# Harbor job config: competitor head-to-head (plan task 1.4).
#
# Four arms on the SAME task image, model, budget, and verifier:
#   1. agentify-claude  — Claude Code + Agentify (hooks, budgeted injection)
#   2. memorybank-claude — Claude Code + the same knowledge stuffed verbatim
#      into CLAUDE.md (the Cline-style zero-infrastructure memory bank; tests
#      whether budgeted retrieval beats context stuffing)
#   3. serena-claude    — Claude Code + the Serena MCP server (pinned), the
#      free LSP code-intelligence competitor, with the same knowledge as
#      native .serena/memories (EXPERIMENTAL — see agents/serena_claude.py)
#   4. claude-code      — Harbor's plain baseline, no memory, no tools
#
# Fairness: arms 1-3 render the SAME committed fixture source
# (/opt/agentify-fixtures, baked into every image) into their own native
# formats at trial start; nothing else differs. See docs/harbor.md
# "Competitor arms (head-to-head)".
#
# Task mix: the five memory families (decision recall, prior-failure
# avoidance, stale rejection, two contract recalls), both repo-intelligence
# tasks, and the mechanical control (all arms should tie there — a competitor
# arm winning the control means the harness leaks, not that the tool is good).
#
# Launch from evals/harbor/ with:  harbor run -c suites/headtohead.yaml
# Always check the ceiling first:  agentify eval harbor plan --suite headtohead
jobs_dir: jobs

n_attempts: 3
n_concurrent_trials: 2

datasets:
  - path: tasks
    task_names:
      - recall-error-envelope
      - avoid-cache-regression
      - reject-stale-config-path
      - recall-retry-schedule
      - recall-webhook-signature
      - rename-shipping-rate-refs
      - select-affected-tests
      - mechanical-header-bump

agents:
  - import_path: agents.agentify_claude:AgentifyClaudeAgent
    model_name: anthropic/claude-haiku-4-5-20251001
    kwargs:
      profile: balanced
      max_budget_usd: 0.35
      max_turns: 16
  - import_path: agents.memorybank_claude:MemoryBankClaudeAgent
    model_name: anthropic/claude-haiku-4-5-20251001
    kwargs:
      max_budget_usd: 0.35
      max_turns: 16
  - import_path: agents.serena_claude:SerenaClaudeAgent
    model_name: anthropic/claude-haiku-4-5-20251001
    kwargs:
      max_budget_usd: 0.35
      max_turns: 16
  - name: claude-code
    model_name: anthropic/claude-haiku-4-5-20251001
    kwargs:
      max_budget_usd: 0.35
