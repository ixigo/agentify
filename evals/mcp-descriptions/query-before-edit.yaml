schema: eval-task-v1
id: query-before-edit
description: >-
  Repo-wide rename that only succeeds if the agent finds every usage before
  editing. Weighted toward the situation where consulting the structural index
  before touching code is the correct move. Measures whether trigger-condition
  descriptions (set b) raise the tool-call rate versus the shipped wording
  (set a) without regressing task outcome.
# Pinned to the main-v1 merge head, where #332 and #334 have both landed, so the
# repo under test is the merged branch and the eight-tool server is present.
base_ref: adebe135225db6f6c15c55b9efbedd4c4ec9f8a8
# The prompt describes the goal (a correct rename), never a tool or a lookup,
# and promises only what the grader checks: a complete, consistent rename.
prompt: >-
  The helper firstFinite in src/core/harbor.js is being renamed to firstNumber.
  Rename its definition and update every place in the codebase that uses it. Do
  not leave any use of the old name behind.
model: claude-haiku-4-5-20251001
max_budget_usd: 0.35
max_turns: 12
timeout_seconds: 600
repeat: 3
arms:
  - agentify
  - plain-safe
mcp_tools: true
description_ablations:
  - a
  - b
grader:
  # The old name must be gone everywhere and the new definition must exist;
  # both fail on the unchanged base, so an empty edit cannot pass. (A rename is
  # graded by completeness, not by running the suite, which would need an
  # install the disposable clone does not have.)
  commands:
    - test -z "$(git grep -n 'firstFinite' -- src test || true)"
    - git grep -nq 'function firstNumber' -- src/core/harbor.js
    # The new name must appear as often as the old one did at base (10
    # references across src+test), so deleting call sites instead of renaming
    # them cannot pass.
    - test "$(git grep -oh 'firstNumber' -- src test | wc -l | tr -d ' ')" -ge 10
forbidden_paths:
  - .claude/**
  - CLAUDE.md
